<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Bridge Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --primary: #6750a4;
      --primary-hover: #523c8a;
      --primary-light: #eaddff;
      --primary-container: #e8def8;
      --success: #1d6d2f;
      --success-light: #e8f5e9;
      --danger: #ba1a1a;
      --danger-light: #fef2f2;
      --warning: #b45309;
      --warning-light: #fffbeb;
      --bg-main: #fdf7ff;
      --surface: #ffffff;
      --border: #eaddff;
      --text-main: #1c1b1f;
      --text-muted: #49454f;
      --radius: 16px;
      --shadow: 0 4px 12px -2px rgba(103, 80, 164, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; min-height: 100vh; }
    .app-container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { font-size: 30px; color: var(--primary); }
    .brand-text h1 { font-size: 18px; font-weight: 700; }
    .main-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; }
    @media (max-width: 860px) { .main-grid { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .panel-header h2 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 9999px; }
    .badge-online { background: var(--success-light); color: var(--success); }
    .badge-offline { background: #f1f5f9; color: var(--text-muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--primary-container); color: var(--text-main); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
    .btn-danger { background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; }
    .btn-lg { padding: 12px 20px; font-size: 14px; border-radius: 20px; }
    .btn-block { width: 100%; }
    .view-state { display: none; }
    .view-state.active { display: block; }
    .qr-scan-box { text-align: center; padding: 20px 14px; border: 2px dashed var(--border); border-radius: var(--radius); background: #faf5ff; }
    .divider { display: flex; align-items: center; margin: 16px 0 12px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider span { padding: 0 10px; font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .manual-input-group { display: flex; flex-direction: column; gap: 8px; max-width: 300px; margin: 0 auto; }
    .manual-input-group input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 13px; outline: none; }
    .command-list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
    .command-card { background: #faf5ff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    .command-top { display: flex; justify-content: space-between; align-items: center; }
    .badge-inbox { background: #e0f2fe; color: #0369a1; }
    .badge-sent { background: var(--success-light); color: var(--success); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 480px; padding: 18px; box-shadow: var(--shadow); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .btn-close { background: transparent; border: none; font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="navbar">
      <div class="brand">
        <span class="material-symbols-outlined brand-icon">sensors</span>
        <div class="brand-text">
          <h1>SMS Bridge</h1>
        </div>
      </div>
      <button id="configBtn" class="btn btn-outline">
        <span class="material-symbols-outlined">settings</span>
        <span>Firebase Setup</span>
      </button>
    </header>

    <main class="main-grid">
      <!-- Device Panel -->
      <section class="panel">
        <div class="panel-header">
          <h2><span class="material-symbols-outlined">phone_android</span> Device</h2>
          <span id="connectionBadge" class="badge badge-offline">🔴 Disconnected</span>
        </div>

        <div id="unpairedView" class="view-state active">
          <div class="qr-scan-box">
            <span class="material-symbols-outlined" style="font-size:44px;color:var(--primary);margin-bottom:8px;">qr_code_scanner</span>
            <h3 style="margin-bottom:6px;font-size:15px;">Pair with Android Phone</h3>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
              <button id="startScanBtn" class="btn btn-primary btn-block">
                <span class="material-symbols-outlined">photo_camera</span>
                <span>Open Camera</span>
              </button>
            </div>
            <div class="divider"><span>OR MANUAL PAIRING</span></div>
            <div class="manual-input-group">
              <input type="text" id="manualDeviceId" placeholder="Device ID (e.g. DEV-XXXXXX)" />
              <input type="text" id="manualToken" placeholder="6-digit Token" maxlength="6" />
              <button id="manualPairBtn" class="btn btn-primary">Connect Device</button>
            </div>
          </div>
        </div>

        <div id="pairedView" class="view-state">
          <div style="background:#fdf7ff; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:12px;">
            <div style="font-size:13px; font-weight:700;" id="connectedDeviceId">DEV-XXXXXX</div>
            <div style="font-size:12px; color:var(--success);" id="deviceLiveStatus">🟢 Online & Synced</div>
          </div>
          <button id="disconnectBtn" class="btn btn-danger btn-block">
            <span class="material-symbols-outlined">link_off</span>
            <span>Disconnect</span>
          </button>
        </div>
      </section>

      <!-- SMS Panel -->
      <section class="panel">
        <div class="panel-header">
          <div style="display:flex; gap:6px;">
            <button id="tabInboxBtn" class="btn btn-primary btn-sm">Phone SMS (<span id="inboxCount">0</span>)</button>
            <button id="tabSendBtn" class="btn btn-outline btn-sm">Send SMS</button>
          </div>
          <button id="syncSmsBtn" class="btn btn-sm btn-outline">
            <span class="material-symbols-outlined" style="font-size:16px;">sync</span>
            <span>Sync SMS</span>
          </button>
        </div>

        <!-- Tab 1: Inbox View -->
        <div id="inboxView">
          <div id="inboxList" class="command-list">
            <p style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px;">Pair phone to see & sync SMS.</p>
          </div>
        </div>

        <!-- Tab 2: Send Form -->
        <div id="sendView" style="display:none;">
          <form id="smsForm" style="display:flex; flex-direction:column; gap:12px;">
            <input type="tel" id="recipientNumber" placeholder="Recipient: 017XXXXXXXX" required style="padding:10px; border-radius:8px; border:1px solid var(--border);" />
            <textarea id="smsMessage" rows="3" placeholder="Type SMS message..." required style="padding:10px; border-radius:8px; border:1px solid var(--border);"></textarea>
            <button type="submit" id="sendSmsBtn" class="btn btn-primary btn-block" disabled>Send SMS via Phone</button>
          </form>
        </div>
      </section>
    </main>

    <!-- Modals -->
    <div id="scannerModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Scan QR Code</h3>
          <button id="closeScannerBtn" class="btn-close">&times;</button>
        </div>
        <div id="qr-reader" style="width:100%;"></div>
      </div>
    </div>

    <div id="configModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Firebase Config</h3>
          <button id="closeConfigBtn" class="btn-close">&times;</button>
        </div>
        <textarea id="firebaseConfigInput" rows="6"></textarea>
        <button id="saveConfigBtn" class="btn btn-primary btn-block" style="margin-top:10px;">Save Config</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_CONFIG = {
      projectId: "sms-bridge-app",
      authDomain: "sms-bridge-app.firebaseapp.com",
      storageBucket: "sms-bridge-app.appspot.com",
      messagingSenderId: "469402031854",
      appId: "1:469402031854:web:smsbridgeapp"
    };

    let db = null;
    let currentDeviceId = localStorage.getItem('sms_bridge_device_id') || null;
    let html5QrScanner = null;

    document.addEventListener('DOMContentLoaded', () => {
      initFirebase();
      setupEvents();
      if (currentDeviceId) attachListeners(currentDeviceId);
    });

    function initFirebase() {
      let cfg = DEFAULT_CONFIG;
      const stored = localStorage.getItem('sms_bridge_firebase_config');
      if (stored) { try { cfg = JSON.parse(stored); } catch(e){} }
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        db = firebase.firestore();
      } catch (err) { console.error(err); }
    }

    function setupEvents() {
      document.getElementById('configBtn').onclick = () => {
        document.getElementById('firebaseConfigInput').value = localStorage.getItem('sms_bridge_firebase_config') || JSON.stringify(DEFAULT_CONFIG, null, 2);
        document.getElementById('configModal').classList.add('active');
      };
      document.getElementById('closeConfigBtn').onclick = () => document.getElementById('configModal').classList.remove('active');
      document.getElementById('saveConfigBtn').onclick = () => {
        try {
          const cfg = JSON.parse(document.getElementById('firebaseConfigInput').value);
          localStorage.setItem('sms_bridge_firebase_config', JSON.stringify(cfg));
          location.reload();
        } catch(e) { alert('Invalid JSON'); }
      };

      document.getElementById('tabInboxBtn').onclick = () => {
        document.getElementById('inboxView').style.display = 'block';
        document.getElementById('sendView').style.display = 'none';
      };
      document.getElementById('tabSendBtn').onclick = () => {
        document.getElementById('inboxView').style.display = 'none';
        document.getElementById('sendView').style.display = 'block';
      };

      document.getElementById('startScanBtn').onclick = () => {
        document.getElementById('scannerModal').classList.add('active');
        html5QrScanner = new Html5Qrcode('qr-reader');
        html5QrScanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 }, (text) => {
          try {
            const data = JSON.parse(text);
            initiatePairing(data.deviceId, data.token);
            html5QrScanner.stop().then(() => document.getElementById('scannerModal').classList.remove('active'));
          } catch(e) { alert('Invalid QR'); }
        }).catch(() => alert('Camera permission error. Use Manual Pairing.'));
      };
      document.getElementById('closeScannerBtn').onclick = () => {
        if (html5QrScanner) html5QrScanner.stop().catch(()=>{});
        document.getElementById('scannerModal').classList.remove('active');
      };

      document.getElementById('manualPairBtn').onclick = () => {
        const dId = document.getElementById('manualDeviceId').value.trim().toUpperCase();
        const tok = document.getElementById('manualToken').value.trim().toUpperCase();
        if (dId && tok) initiatePairing(dId, tok);
      };

      document.getElementById('disconnectBtn').onclick = () => {
        if (db && currentDeviceId) db.collection('devices').doc(currentDeviceId).set({ paired: false }, { merge: true });
        localStorage.removeItem('sms_bridge_device_id');
        location.reload();
      };

      document.getElementById('syncSmsBtn').onclick = async () => {
        if (!db || !currentDeviceId) return;
        const cmdId = 'SYNC-' + Date.now();
        await db.collection('commands').doc(currentDeviceId).collection('messages').doc(cmdId).set({
          commandId: cmdId, type: 'LOAD_SMS', recipient: 'SELF', message: 'Sync SMS', status: 'pending', createdAt: Date.now()
        });
      };

      document.getElementById('smsForm').onsubmit = async (e) => {
        e.preventDefault();
        if (!db || !currentDeviceId) return;
        const rec = document.getElementById('recipientNumber').value.trim();
        const msg = document.getElementById('smsMessage').value.trim();
        const cmdId = 'CMD-' + Date.now();
        await db.collection('commands').doc(currentDeviceId).collection('messages').doc(cmdId).set({
          commandId: cmdId, type: 'SMS', recipient: rec, message: msg, status: 'pending', createdAt: Date.now()
        });
        document.getElementById('recipientNumber').value = '';
        document.getElementById('smsMessage').value = '';
        alert('SMS command sent!');
      };
    }

    async function initiatePairing(deviceId, token) {
      if (!db) { alert('Firebase not ready'); return; }
      try {
        await db.collection('devices').doc(deviceId).set({
          pendingRequesterId: 'WEB-' + Date.now(),
          pendingPairingToken: token,
          pendingClientInfo: 'Web Dashboard',
          pendingRequestedAt: Date.now()
        }, { merge: true });

        alert('Pairing request sent! Tap "Allow" on phone.');
        db.collection('devices').doc(deviceId).onSnapshot(doc => {
          if (doc.exists && doc.data().paired) {
            currentDeviceId = deviceId;
            localStorage.setItem('sms_bridge_device_id', deviceId);
            attachListeners(deviceId);
          }
        });
      } catch (e) { alert('Error: ' + e.message); }
    }

    function attachListeners(deviceId) {
      document.getElementById('unpairedView').classList.remove('active');
      document.getElementById('pairedView').classList.add('active');
      document.getElementById('connectionBadge').className = 'badge badge-online';
      document.getElementById('connectionBadge').textContent = '🟢 Connected';
      document.getElementById('connectedDeviceId').textContent = deviceId;
      document.getElementById('sendSmsBtn').disabled = false;

      // Realtime SMS inbox listener
      db.collection('inbox').doc(deviceId).collection('messages').orderBy('date', 'desc').limit(50)
        .onSnapshot(snap => {
          document.getElementById('inboxCount').textContent = snap.size;
          if (snap.empty) {
            document.getElementById('inboxList').innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px;">No SMS in inbox. Click "Sync SMS".</p>';
            return;
          }
          let html = '';
          snap.forEach(doc => {
            const m = doc.data();
            const isSent = m.type === 'sent';
            html += `<div class="command-card" style="border-left:3px solid ${isSent?'var(--primary)':'var(--success)'};">
              <div class="command-top"><strong>${m.address||'Unknown'}</strong><span class="badge ${isSent?'badge-sent':'badge-inbox'}">${isSent?'SENT':'INBOX'}</span></div>
              <div style="font-size:13px;">${m.body||''}</div>
              <div style="font-size:11px;color:var(--text-muted);">${new Date(m.date||Date.now()).toLocaleString()}</div>
            </div>`;
          });
          document.getElementById('inboxList').innerHTML = html;
        });
    }
  </script>
</body>
</html>
